# XcodeGen spec — run `xcodegen` in this folder, then open FormaSync.xcodeproj
name: FormaSync
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "2.1.1"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
targets:
  FormaSync:
    type: application
    platform: iOS
    sources:
      - path: FormaSync
    settings:
      base:
        PRODUCT_NAME: FormaSync
        PRODUCT_BUNDLE_IDENTIFIER: $(FORMA_BUNDLE_ID)
        INFOPLIST_FILE: FormaSync/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FormaSync/FormaSync.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  FormaSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FormaSyncTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(FORMA_BUNDLE_ID).tests
        TEST_TARGET_NAME: FormaSync
    dependencies:
      - target: FormaSync

  FormaSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(FORMA_BUNDLE_ID).uitests
        TEST_TARGET_NAME: FormaSync
    dependencies:
      - target: FormaSync
schemes:
  FormaSync:
    build:
      targets:
        FormaSync: all
    test:
      targets:
        - FormaSyncTests
        - FormaSyncUITests
    run:
      config: Debug
